<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabidin Playground 🏪💸</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@3.2.1/dist/aframe-animation-component.min.js"></script>
    <script src="https://npmcdn.com/aframe-event-set-component@3.0.1"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://npmcdn.com/aframe-template-component@3.1.1"></script>
    <link rel="icon" type="image/svg"
        href="https://cdn.glitch.global/e8e70e03-1ca6-4218-9393-926b4ea3d4c0/icone.svg?v=1718057931501">

    <style>
        /* é definida a estilização da tela de loading minimalista */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loading-title {
            color: #0d47a1;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .loader-track {
            width: 250px;
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            position: absolute;
            height: 100%;
            width: 50%;
            background-color: #fbc02d;
            border-radius: 10px;
            animation: slide-loading 1.2s infinite ease-in-out alternate;
        }

        @keyframes slide-loading {
            0% {
                left: 0;
                background-color: #fbc02d;
            }
            100% {
                left: 50%;
                background-color: #1976d2;
            }
        }
    </style>
</head>

<body>
    <!-- é inserida a estrutura html da tela de loading -->
    <div id="loading-screen">
        <div class="loading-title">Carregando playground...</div>
        <div class="loader-track">
            <div class="loader-fill"></div>
        </div>
    </div>

    <a-scene>
        <a-assets>
            <!-- é feito o pré-carregamento do modelo 3d para evitar pop-in -->
            <a-asset-item id="store-model-asset" src="assets/shopping_store.glb"></a-asset-item>

            <img id="textura-fundo" src="assets/ui/fundo-branco.png">
            <img id="textura-aceitar" src="assets/ui/botao-aceitar.png">
            <img id="textura-negar" src="assets/ui/botao-negar.png">
            <img id="textura-zerar" src="assets/ui/botao-zerar.png" alt="">
            <img id="textura-entregar" src="assets/ui/botao-entregar.png" alt="">
            <img id="textura-reiniciar" src="assets/ui/botao-reiniciar.png" alt="">

            <img id="mural-explicativo" src="assets/ui/mural-explicativo.png" alt="">
            <img id="fundo-cidade" src="assets/ui/cidade.jpg" alt="">

            <img id="betinho-feliz" src="assets/ui/betinho-feliz.png" alt="">
            <img id="betinho-triste" src="assets/ui/betinho-triste.png" alt="">

            <img id="cedula-1-textura" src="assets/ui/cedula-1.jpg">
            <img id="cedula-2-textura" src="assets/ui/cedula-2.jpg">
            <img id="cedula-5-textura" src="assets/ui/cedula-5.jpg">
            <img id="cedula-10-textura" src="assets/ui/cedula-10.jpg">
            <img id="cedula-20-textura" src="assets/ui/cedula-20.jpg">
            <img id="cedula-50-textura" src="assets/ui/cedula-50.jpg">
            <img id="cedula-100-textura" src="assets/ui/cedula-100.jpg">

            <audio id="click-sound" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
            <!-- é referenciada a nova música de fundo com preload -->
            <audio id="background-music" src="assets/musica-fundo.mp3" preload="auto" crossorigin="anonymous"></audio>
            <audio id="correct-sound"
                src="https://cdn.glitch.global/e8e70e03-1ca6-4218-9393-926b4ea3d4c0/certo.ogg?v=1718058002234"></audio>
            <audio id="incorrect-sound"
                src="https://cdn.glitch.global/e8e70e03-1ca6-4218-9393-926b4ea3d4c0/errado.ogg?v=1718058002528"></audio>
        </a-assets>

        <!-- é tocada a música de fundo em loop com volume baixo -->
        <a-entity sound="src: #background-music; autoplay: true; loop: true; volume: 0.02"></a-entity>

        <a-entity id="playground" position="-3 -0.6 -4">
            <!-- é instanciado o modelo 3d usando o asset pré-carregado -->
            <a-entity id="store-model-entity" position="0 0 -0.5" rotation="0 0 0" gltf-model="#store-model-asset"
                scale="1.5 1.5 1.5"></a-entity>

            <a-entity position="6.2 1.5 -0.1" id="troco-mensagem" rotation="0 -90 0"
                animation="property: position; to: 6.2 1.3 -0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
                <a-plane position="6.9 1.5 2.7" rotation="0 -90 0" width="0.7" height="0.7"
                    material="src: #betinho-triste; transparent: true;" id="betinho-troco"></a-plane>
                <a-plane position="7 1.5 3.5" rotation="0 -90 0" width="3" height="1"
                    material="src: #textura-fundo; transparent: true;"></a-plane>
                
                <a-text value="Mandou mal!" position="7 1.55 4" rotation="0 -90 0" width="1.5" align="center"
                    color="black" font="assets/ui/Sora-Medium-msdf.json" font-image="assets/ui/Sora-Medium.png"
                    negate="false" wrap-count="25" id="troco-betinho-texto"></a-text>
            </a-entity>

            <a-entity position="6.5 0.5 -0.6" rotation="0 -90 0" id="painel-troco">
                <a-text value="TROCO: 0R$" position="7 1.55 3.9" rotation="0 -90 0" width="1.5" align="center"
                    color="white" font="assets/ui/Sora-Medium-msdf.json" font-image="assets/ui/Sora-Medium.png" negate="false"
                    wrap-count="25" id="troco"></a-text>
                
                <a-plane position="6.9 1.2 4.3" rotation="0 -90 0" width="0.85" height="0.3"
                    material="src: #textura-zerar; transparent: true;" class="interagivel" id="zerar"
                    event-set__mouseenter="_event: mouseenter; scale: 1.05 1.05 1.05"
                    event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                    sound="on: click; src: #click-sound"></a-plane>
                <a-plane position="6.9 1.2 3.5" rotation="0 -90 0" width="0.85" height="0.3"
                    material="src: #textura-entregar; transparent: true;" class="interagivel" id="entregar"
                    event-set__mouseenter="_event: mouseenter; scale: 1.05 1.05 1.05"
                    event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                    sound="on: click; src: #click-sound"></a-plane>

                <a-entity layout="type: line; margin: 0.3;" position="6.3 1 3.2" rotation="0 -90 0">
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-1-textura;"
                        id="cedula-1" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-2-textura;"
                        id="cedula-2" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-5-textura;"
                        id="cedula-5" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-10-textura;"
                        id="cedula-10" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-20-textura;"
                        id="cedula-20" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-50-textura;"
                        id="cedula-50" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                    <a-plane rotation="-90 -90 0" width="0.5" height="0.25" material="src: #cedula-100-textura;"
                        id="cedula-100" event-set__mouseenter="_event: mouseenter; scale: 1.1 1.1 1.1"
                        event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                        sound="on: click; src: #click-sound"></a-plane>
                </a-entity>
            </a-entity>

            <a-plane position="12 1.5 12" rotation="0 -90 0" width="3" height="4"
                material="src: #textura-cliente; transparent: true" id="cliente"
                animation="property: position; to: 12 1.5 -12; dur: 5000; easing: linear; loop: true; enabled: true;">
            </a-plane>

            <a-entity position="0 2 0" id="mensagem-betinho" visible="false"
                animation="property: position; to: 0 1.7 0; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
                <a-plane position="6.9 1.5 2.7" rotation="0 -90 0" width="0.7" height="0.7"
                    material="src: #betinho-triste; transparent: true;" id="imagem-betinho"></a-plane>
                <a-plane position="7 1.5 3.5" rotation="0 -90 0" width="3" height="1"
                    material="src: #textura-fundo; transparent: true;"></a-plane>
                
                <a-text value="" position="7 1.55 4" rotation="0 -90 0" width="1.5" align="center" color="black"
                    font="assets/ui/Sora-Medium-msdf.json" font-image="assets/ui/Sora-Medium.png" negate="false" wrap-count="25"
                    id="texto-betinho"></a-text>
            </a-entity>

            <a-plane position="3 1.5 1.5" rotation="0 0 0" width="2.5" height="2.5"
                material="src: #mural-explicativo; transparent: true;"
                animation="property: position; to: 3 1.55 1.5; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-plane>

            <a-plane position="25 4.5 -5" rotation="0 -90 0" width="50" height="16" material="src: #fundo-cidade;"
                animation="property: scale; to: 1.05 1.05 1.05; dur: 3000; easing: easeInOutQuad; loop: true; dir: alternate"></a-plane>

            <a-entity id="interacao" position="-1.8 0 0">
                <a-plane position="7 1.5 3.5" rotation="0 -90 0" width="3" height="1"
                    material="src: #textura-fundo; transparent: true; opacity: 0.8"></a-plane>
                <a-plane position="6.9 1.2 4.1" rotation="0 -90 0" width="0.85" height="0.3"
                    material="src: #textura-aceitar; transparent: true;" class="interagivel" id="aceitar"
                    event-set__mouseenter="_event: mouseenter; scale: 1.2 1.2 1.2"
                    event-set__mouseleave="_event: mouseleave; scale: 1 1 1"
                    sound="on: click; src: #click-sound"></a-plane>
                <a-plane position="6.9 1.2 3" rotation="0 -90 0" width="0.85" height="0.3"
                    material="src: #textura-negar; transparent: true;" class="interagivel" id="negar"
                    event-set__mouseenter="_event: mouseenter; scale: 1.2 1.2 1.2"
                    event-set__mouseleave="_event: mouseleave; scale: 1 1 1" reset-animation
                    sound="on: click; src: #click-sound"></a-plane>
                
                <a-text
                    value="Olá, meu nome é joãozinho, e eu queria comprar dois carrinhos de brinquedo pelo preço de 200 reais. Você aceita?"
                    position="7 1.7 3.5" rotation="0 -90 0" width="2.5" align="center" color="black"
                    font="assets/ui/Sora-Medium-msdf.json" font-image="assets/ui/Sora-Medium.png" negate="false"
                    id="texto-interacao"></a-text>
            </a-entity>

            <a-text value="SALDO DA LOJA: 0R$" position="-2 2.3 3.5" rotation="0 90 0" width="3.5" align="center"
                color="white" font="assets/ui/Sora-Medium-msdf.json" font-image="assets/ui/Sora-Medium.png" negate="false"
                id="texto-saldo"></a-text>
            
            <a-plane position="-2 1.5 3.5" rotation="0 90 0" width="2.5" height="1"
                material="src: #textura-reiniciar; transparent: true;"
                event-set__mouseenter="_event: mouseenter; scale: 1.2 1.2 1.2"
                event-set__mouseleave="_event: mouseleave; scale: 1 1 1" class="interagivel" id="reiniciar"></a-plane>
        </a-entity>

        <a-entity camera look-controls wasd-controls position="0 1.7 0" rotation="180 0 0">
            <a-cursor fuse="true" raycaster="objects: .interagivel"
                event-set__1="_event: mouseenter; color: springgreen"
                event-set__2="_event: mouseleave; color: black"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        // são referenciados os elementos globais da interface
        const interactionEntity = document.getElementById('interacao');
        const interactionTextElement = document.getElementById('texto-interacao');
        const feedbackEntity = document.getElementById('mensagem-betinho');
        const feedbackTextElement = document.getElementById('texto-betinho');
        const feedbackImageElement = document.getElementById('imagem-betinho');
        const changePanelElement = document.getElementById('painel-troco');
        const changeFeedbackEntity = document.getElementById('troco-mensagem');
        const changeFeedbackTextElement = document.getElementById('troco-betinho-texto');
        const restartButton = document.querySelector('#reiniciar');
        const balanceTextElement = document.getElementById('texto-saldo');
        const changeTextElement = document.getElementById('troco');
        
        let customerEntity;
        let acceptButton;
        let denyButton;
        let deliverButton;

        const customerTextures = [
            'assets/ui/pato.png',
            'assets/ui/pombo.png',
            'assets/ui/tubarao.png',
        ];
        let currentTextureIndex = 0;
        let currentBalance = 0;
        let insertedChange = 0;
        let orderValue;
        let paidValue = 0;

        const customerNames = ["Alex", "Cris", "Dani", "Julio", "Léo", "Nico", "Tay", "Bia", "Tuca", "Sami", "Rafa", "Cau", "Gui", "Tati", "Fran"];
        const purchaseQuantities = [1, 2, 3, 4];
        const productNames = ["carrinho(s) de brinquedo", "urso(s) de pelucia", "caixa(s) de blocos de construção"];
        
        const salePrices = {
            "carrinho(s) de brinquedo": 20,
            "urso(s) de pelucia": 35,
            "caixa(s) de blocos de construção": 110
        };
        const purchasePrices = {
            "carrinho(s) de brinquedo": 15,
            "urso(s) de pelucia": 30,
            "caixa(s) de blocos de construção": 100
        };

        // é obtido um elemento aleatório de uma lista
        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // é alterada a classe interativa dos painéis e botões
        function toggleInteractableElements(selector, shouldAdd) {
            const elements = document.querySelectorAll(selector);
            elements.forEach(function (element) {
                if (shouldAdd) {
                    element.classList.add('interagivel');
                } else {
                    element.classList.remove('interagivel');
                }
            });
        }

        // é gerada uma nova frase de pedido para o cliente atual
        function generateCustomerPhrase() {
            const name = getRandomElement(customerNames);
            const quantity = getRandomElement(purchaseQuantities);
            const product = getRandomElement(productNames);
            const unitSalePrice = salePrices[product];
            const unitPurchasePrice = purchasePrices[product];
            const totalCost = quantity * unitPurchasePrice;
            
            // é calculado o valor inicial do pedido com variação aleatória
            orderValue = (quantity * unitSalePrice) + (Math.floor(Math.random() * 31) - 25);
            
            // é aplicado um ajuste para evitar que o valor do pedido seja idêntico ao custo total
            if (orderValue === totalCost) {
                const randomAdjustment = (Math.random() > 0.5) ? 5 : -5;
                orderValue += randomAdjustment;
            }
            
            // é ajustado o valor caso a variação torne o pedido negativo ou gratuito
            if (orderValue <= 0) {
                orderValue = totalCost + 5;
            }
            
            interactionTextElement.setAttribute('data-quantidade', quantity);
            interactionTextElement.setAttribute('data-produto', product);
            interactionTextElement.setAttribute('data-valor-pedido', orderValue);
            
            return `Olá, meu nome é ${name} gostaria de comprar ${quantity} ${product} pelo preço de ${orderValue} reais. Tudo bem?`;
        }

        // é validada a decisão do jogador e exibido o feedback
        function verifySaleDecision(isAccepted) {
            const quantity = parseInt(interactionTextElement.getAttribute('data-quantidade'));
            const product = interactionTextElement.getAttribute('data-produto');
            const requestedValue = parseInt(interactionTextElement.getAttribute('data-valor-pedido'));
            const unitPurchasePrice = purchasePrices[product];
            const totalCost = quantity * unitPurchasePrice;
            const profit = requestedValue - totalCost;

            feedbackEntity.setAttribute('visible', true);

            // é avaliado se o valor de venda resulta em lucro ou prejuízo
            if (totalCost < requestedValue) {
                if (isAccepted) {
                    feedbackTextElement.setAttribute('value', 'Boa decisão! você teve lucro de ' + profit + ' reais.');
                    feedbackImageElement.setAttribute('src', '#betinho-feliz');
                    document.querySelector('#correct-sound').play();
                } else {
                    feedbackTextElement.setAttribute('value', 'Má decisão. você teria lucro de ' + profit + ' reais.');
                    feedbackImageElement.setAttribute('src', '#betinho-triste');
                    document.querySelector('#incorrect-sound').play();
                }
            } else {
                if (isAccepted) {
                    feedbackTextElement.setAttribute('value', 'Má decisão. você teve prejuizo de ' + -profit + ' reais.');
                    feedbackImageElement.setAttribute('src', '#betinho-triste');
                    document.querySelector('#incorrect-sound').play();
                } else {
                    feedbackTextElement.setAttribute('value', 'Boa decisão! você teria prejuizo de ' + -profit + ' reais.');
                    feedbackImageElement.setAttribute('src', '#betinho-feliz');
                    document.querySelector('#correct-sound').play();
                }
            }

            // é programada a ocultação do feedback após 4 segundos
            setTimeout(function () {
                feedbackEntity.setAttribute('visible', false);
            }, 4000);
        }

        // é incrementado o valor do troco conforme a cédula selecionada
        function updateInsertedChange(valueToAdd) {
            insertedChange += valueToAdd;
            changeTextElement.setAttribute('value', 'TROCO: ' + insertedChange + 'R$');
        }

        // é acionada a animação de saída do cliente do estabelecimento
        function dismissCustomer() {
            customerEntity.object3D.position.z = 2.85;
            const animationComponent = customerEntity.components.animation;
            if (animationComponent) animationComponent.play();
        }

        // é reiniciado o contador do troco atual
        function resetChangeCounter() {
            insertedChange = 0;
            changeTextElement.setAttribute('value', 'TROCO: ' + insertedChange + 'R$');
        }

        // é registrado o componente que monitora a chegada de novos clientes
        AFRAME.registerComponent('check-position', {
            init: function () {
                this.isAlreadyStopped = false; 
            },

            tick: function () {
                const currentPosition = this.el.object3D.position;
                const zCoordinate = currentPosition.z;

                // é pausada a caminhada do cliente ao chegar na loja
                if (!this.isAlreadyStopped && zCoordinate <= 3 && zCoordinate >= 2.9) {
                    const animationComponent = this.el.components.animation;
                    if (animationComponent) animationComponent.pause();
                    this.isAlreadyStopped = true; 
                    interactionEntity.setAttribute('visible', true);
                }

                // é liberado o ciclo de chegada após o cliente sair da área de interação
                if (this.isAlreadyStopped && (zCoordinate > 3 || zCoordinate < 2.8)) {
                    this.isAlreadyStopped = false; 
                    interactionEntity.setAttribute('visible', false);
                }

                // é trocada a textura e gerada uma nova frase para o próximo cliente
                if (currentPosition.z === -12) {
                    currentTextureIndex = (currentTextureIndex + 1) % customerTextures.length;
                    customerEntity.setAttribute('material', 'src', customerTextures[currentTextureIndex]);

                    acceptButton.setAttribute('visible', true);
                    denyButton.setAttribute('visible', true);
                    
                    const newPhrase = generateCustomerPhrase();
                    interactionTextElement.setAttribute('value', newPhrase);
                }
            }
        });

        // é registrado um componente vazio para lidar com cliques extras
        AFRAME.registerComponent('reset-animation', {
            init: function () {
                this.el.addEventListener('click', function () {
                });
            }
        });

        // são aplicadas as rotinas de inicialização e eventos
        document.addEventListener('DOMContentLoaded', function () {
            
            // é aguardada a renderização completa do modelo 3d da loja para remover a tela de loading
            const storeModelEntity = document.querySelector('#store-model-entity');
            
            storeModelEntity.addEventListener('model-loaded', function () {
                const loadingScreenElement = document.getElementById('loading-screen');
                loadingScreenElement.style.opacity = '0';
                
                setTimeout(function () {
                    loadingScreenElement.style.display = 'none';
                }, 500);
            });

            customerEntity = document.querySelector('#cliente');
            acceptButton = document.querySelector('#aceitar');
            denyButton = document.querySelector('#negar');
            deliverButton = document.querySelector('#entregar');

            const initialPhrase = generateCustomerPhrase();
            interactionTextElement.setAttribute('value', initialPhrase);

            customerEntity.setAttribute('check-position', '');
            interactionEntity.setAttribute("visible", false);
            changeFeedbackEntity.setAttribute('visible', false);
            customerEntity.setAttribute('material', 'src', customerTextures[0]);

            toggleInteractableElements('#cedula-1, #cedula-2, #cedula-5, #cedula-10, #cedula-20, #cedula-50, #cedula-100, #entregar, #zerar', false);

            // é zerado o saldo ao reiniciar o sistema
            restartButton.addEventListener('click', function () {
                currentBalance = 0;
                balanceTextElement.setAttribute('value', 'SALDO DA LOJA: ' + currentBalance + 'R$');
            });

            // é tratada a aceitação da oferta
            acceptButton.addEventListener('click', function () {
                verifySaleDecision(true);

                paidValue = orderValue + Math.floor(Math.random() * 30) + 1;
                interactionTextElement.setAttribute('value', `Comprei por ${orderValue}R$, mas vou lhe pagar com ${paidValue}R$. Qual será meu troco?`);
                acceptButton.setAttribute('visible', false);
                denyButton.setAttribute('visible', false);

                toggleInteractableElements('#cedula-1, #cedula-2, #cedula-5, #cedula-10, #cedula-20, #cedula-50, #cedula-100, #entregar, #zerar', true);
            });

            // é tratada a recusa da oferta
            denyButton.addEventListener('click', function () {
                verifySaleDecision(false);

                customerEntity.setAttribute('position', { x: customerEntity.getAttribute('position').x, y: customerEntity.getAttribute('position').y, z: 12 });
                interactionEntity.setAttribute("visible", false);
                dismissCustomer();
            });

            // são registrados os botões referentes às cédulas de dinheiro
            document.querySelector('#cedula-1').addEventListener('click', function () { updateInsertedChange(1); });
            document.querySelector('#cedula-2').addEventListener('click', function () { updateInsertedChange(2); });
            document.querySelector('#cedula-5').addEventListener('click', function () { updateInsertedChange(5); });
            document.querySelector('#cedula-10').addEventListener('click', function () { updateInsertedChange(10); });
            document.querySelector('#cedula-20').addEventListener('click', function () { updateInsertedChange(20); });
            document.querySelector('#cedula-50').addEventListener('click', function () { updateInsertedChange(50); });
            document.querySelector('#cedula-100').addEventListener('click', function () { updateInsertedChange(100); });
            
            document.querySelector('#zerar').addEventListener('click', function () { resetChangeCounter(); });
            
            // é tratado o evento de devolução do troco ao cliente
            deliverButton.addEventListener('click', function () {
                if (insertedChange === (paidValue - orderValue)) {
                    document.getElementById('betinho-troco').setAttribute('src', '#betinho-feliz');
                    changeFeedbackTextElement.setAttribute('value', 'Que bom! Você acertou o troco desse ultimo cliente!');
                    document.querySelector('#correct-sound').play();
                } else {
                    document.getElementById('betinho-troco').setAttribute('src', '#betinho-triste');
                    changeFeedbackTextElement.setAttribute('value', 'Que pena! Voce errou o troco desse ultimo cliente!');
                    document.querySelector('#incorrect-sound').play();
                }
                changeFeedbackEntity.setAttribute('visible', true);

                customerEntity.setAttribute('position', { x: customerEntity.getAttribute('position').x, y: customerEntity.getAttribute('position').y, z: 12 });
                interactionEntity.setAttribute("visible", false);
                dismissCustomer();

                currentBalance += paidValue;
                balanceTextElement.setAttribute('value', 'SALDO DA LOJA: ' + currentBalance + 'R$');

                // é restaurado o aviso padrão do troco após um tempo
                setInterval(function () {
                    changeFeedbackTextElement.setAttribute('value', 'Preste bastante atenção ao calcular o troco do seu cliente!');
                }, 6000);

                toggleInteractableElements('#cedula-1, #cedula-2, #cedula-5, #cedula-10, #cedula-20, #cedula-50, #cedula-100, #entregar, #zerar', false);

                resetChangeCounter();
            });
        });
    </script>
</body>

</html>
